            min-height: 100vh;
            line-height: 1.7;
            overflow-x: hidden;
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            z-index: 0;
            pointer-events: none;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--accent); top: -100px; left: -100px; }

            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 28px 20px 80px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 40px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--cyan));

            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 8px 32px rgba(103, 80, 164, 0.4);

            font-size: 1.25rem;
            font-weight: 800;
            background: linear-gradient(to right, #fff, var(--accent-light));

            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .lang-switch { display: flex; gap: 8px; flex-wrap: wrap; }

            border: 1px solid var(--border);
            background: var(--glass);
            color: var(--text);
            padding: 8px 16px;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s;
            backdrop-filter: blur(10px);

            border-color: var(--accent-light);
            box-shadow: 0 4px 20px rgba(103, 80, 164, 0.35);

            font-weight: 600;

            border-radius: 16px;
            padding: 16px 18px;
            backdrop-filter: blur(16px);
        }

            font-size: 0.75rem;

            color: var(--muted);
            margin-bottom: 4px;

        }

            padding: 16px 18px;

            font-size: 0.9rem;

            text-align: left;

function setLang(lang, btn) {
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.documentElement.lang = lang === 'az' ? 'az' : lang;

    const d = T[lang];
    document.getElementById('badge').textContent = d.badge;
    document.getElementById('title').textContent = d.title;
    document.getElementById('subtitle').textContent = d.subtitle;
    document.getElementById('metaDateLabel').textContent = d.metaDateLabel;
    document.getElementById('metaDate').textContent = d.metaDate;
    document.getElementById('metaDevLabel').textContent = d.metaDevLabel;
    document.getElementById('metaDev').textContent = d.metaDev;
    document.getElementById('metaContactLabel').textContent = d.metaContactLabel;
    document.getElementById('metaPkgLabel').textContent = d.metaPkgLabel;
    document.getElementById('chip1').textContent = d.chip1;
    document.getElementById('chip2').textContent = d.chip2;
    document.getElementById('chip3').textContent = d.chip3;
    document.getElementById('chip4').textContent = d.chip4;
    document.getElementById('footer1').textContent = d.footer1;
    document.getElementById('footer2').innerHTML = d.footer2;

    document.getElementById('sections').innerHTML = d.sections.map(s => `
        <div class="section">
            <h2><span class="section-num">${s.n}</span> ${s.t}</h2>
            ${s.html}
        </div>
    `).join('');
}

setLang('ru', document.querySelector('.lang-btn.active'));
